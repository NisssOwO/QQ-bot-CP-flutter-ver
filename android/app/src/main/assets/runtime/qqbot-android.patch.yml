# Workspace migration patch. Credentials remain in environment variables.
- insert:
  - id: agent-presets
    name: '@shiny-colors/role-presets'
    config:
      roots:
        - path: ./presets
          trust: user
      includeUserRoot: true
      default: !!js "process.env.LLM_PRESET || ''"
  - id: web-tools
    name: '@shiny-colors/web-tools'

- id: llm-pi-ai
  config:
    providers:
      relay:
        displayName: !!js "process.env.LLM_DISPLAY_NAME || 'OpenAI-compatible relay'"
        apiKeyEnv: LLM_API_KEY
        api: !!js "process.env.LLM_API || 'openai-completions'"
        baseURL: !!js "process.env.LLM_BASE_URL || ''"
        models:
          - id: !!js "process.env.LLM_MODEL || ''"
            name: !!js "process.env.LLM_MODEL || ''"
            contextWindow: 131072
            maxTokens: 8192
            reasoning: true
            # qwen-style thinkingFormat is valid only for openai-completions.
            # Responses and Anthropic routes must receive an empty compat object.
            compat: !!js "process.env.LLM_API === 'openai-completions' ? { thinkingFormat: 'qwen' } : {}"

- id: im-qqbot
  config:
    appId: !!js process.env.QQBOT_APPID
    appSecret: !!js process.env.QQBOT_SECRET
    provider: !!js "process.env.LLM_PROVIDER || 'relay'"
    model: !!js "process.env.LLM_MODEL || ''"
    preset: !!js "process.env.LLM_PRESET || ''"
    requireMention: true
    textChunkLimit: 4500
    sessionIdleTimeout: 1800000
    processingTimeoutMs: 120000
    streaming: true
    showToolResults: false
    media:
      enabled: false
      maxMB: 20
      ttlHours: 1
    vision:
      enabled: false
      provider: ''
      model: ''
    directPrompt: ''
    groupPrompt: ''
    debug: true

- id: bash-sandbox
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-bash-persistent
  disabled: true
- id: tool-pwsh
  disabled: true
- id: working-directory
  disabled: true
- id: tool-working-directory
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true

# 手机上没有可用的抓取通道：模型一旦尝试 web_fetch，工具会以
# TOOL_OUTCOME_UNKNOWN 结束整轮对话，聊天里只剩一条报错。聊天机器人不需要
# 联网工具，直接关掉，模型会用自己的知识回答。
- id: tool-web
  disabled: true
- id: web-fetch-http
  disabled: true

- id: image-offload
  disabled: true

- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true

# 手机端只有聊天功能，下列插件依赖桌面环境的 shell/workingDirectory/subagents
# 或遥测上报，加载后必然处于 pending / import 失败状态，只会污染启动日志。
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: permission
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-skill
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true


